name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_DEPS: >-
    build-essential pkg-config gettext libglib2.0-dev libgtk2.0-dev libx11-dev
    libasound2-dev libavformat-dev libavcodec-dev libavutil-dev libswresample-dev
    mpv

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $BUILD_DEPS cppcheck
      - run: make lint

  asan:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $BUILD_DEPS
      - run: make asan
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tools/lsan.supp
