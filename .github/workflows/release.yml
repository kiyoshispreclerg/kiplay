name: Release

# Source zip on every v* tag (or on demand from the Actions tab). Tags
# starting with v0 or containing a hyphen are published as pre-releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against config.mk
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^VERSION *= *//p' config.mk)
          t=${GITHUB_REF_NAME%%-*}   # v0.3.0-rc1 -> v0.3.0
          [ "v$v" = "$t" ] || { echo "::error::tag $GITHUB_REF_NAME != VERSION $v in config.mk"; exit 1; }
      - name: Zip the sources
        run: |
          v=$(sed -n 's/^VERSION *= *//p' config.mk)
          mkdir dist
          git archive --format=zip --prefix="kiplay-$v/" -o "dist/kiplay-$v-src.zip" HEAD
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0') || contains(github.ref_name, '-') }}
